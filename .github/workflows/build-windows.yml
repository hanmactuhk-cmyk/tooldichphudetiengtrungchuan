name: Check source and build Windows
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_build:
        description: 'Download all models and build complete Windows app'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm exec tsx scripts/test-caption-layout.ts
      - run: pnpm exec tsx scripts/test-timeline.ts
      - run: node --check electron-main.cjs
      - run: python -m compileall -q resources/backend scripts
      - run: python scripts/test_video_subtitles.py
      - if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_build }}
        run: powershell -ExecutionPolicy Bypass -File scripts/build-desktop.ps1
      - if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_build }}
        uses: actions/upload-artifact@v4
        with:
          name: HNVoice-Electron-Windows-complete
          path: release/win-unpacked/**
          compression-level: 0
