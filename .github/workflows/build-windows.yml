name: Check source and build Windows
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_build:
        description: 'Download all models and build complete Windows app'
        type: boolean
        default: false
      build_installer:
        description: 'Also build complete Windows installer (requires full_build)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm exec tsx scripts/test-caption-layout.ts
      - run: pnpm exec tsx scripts/test-timeline.ts
      - run: node --check electron-main.cjs
      - run: node scripts/test-project-storage.cjs
      - run: python -m compileall -q resources/backend scripts
      - run: python scripts/test_video_subtitles.py
      - run: python scripts/test_whole_submissions.py
      - run: python scripts/test_browser_ready.py
      - if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_build }}
        run: powershell -ExecutionPolicy Bypass -File scripts/build-desktop.ps1
      - if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_build }}
        uses: actions/upload-artifact@v4
        with:
          name: HNVoice-Electron-Windows-complete
          path: release/win-unpacked/**
          compression-level: 0
      - if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_build && inputs.build_installer }}
        shell: pwsh
        run: |
          $download=Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $download
          if((Get-FileHash $download -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732'){throw 'Inno Setup checksum mismatch'}
          if((Get-AuthenticodeSignature $download).Status -ne 'Valid'){throw 'Inno Setup signature invalid'}
          $compilerHome=Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $setup=Start-Process $download -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/NOICONS',('/DIR="'+$compilerHome+'"')) -Wait -PassThru -WindowStyle Hidden
          if($setup.ExitCode){throw 'Compiler installation failed'}
          ./scripts/build-installer.ps1 -AppDirectory release/win-unpacked -InnoCompiler (Join-Path $compilerHome 'ISCC.exe')
      - if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_build && inputs.build_installer }}
        uses: actions/upload-artifact@v4
        with:
          name: HNVoice-Windows-Installer-complete
          path: release/installer/**
          compression-level: 0
